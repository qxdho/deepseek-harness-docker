name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个 ref 上不并行跑两次（后到的排队），但**不取消正在运行的运行**：
# 多架构构建被半路掐断，GHCR 上可能只推了一半的 tag，比排队更糟。
# 曾经写成 `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`，
# 实测 push 时也会取消前一次运行（867c388 的 build 就这样被掐掉）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 多架构构建并推送 GHCR（PR 不推送）
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG DSH_AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.dsh }}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 单架构构建 + 真实起容器冒烟（PR 也跑）
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG DSH_AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - uses: docker/setup-buildx-action@v3

      # 离线检查先跑：不需要 docker，几秒出结果，避免白等一轮镜像构建。
      - name: 工作区预检离线测试
        run: |
          chmod +x scripts/preflight.sh scripts/test-preflight.sh
          ./scripts/test-preflight.sh

      - name: .env 配置项逻辑测试
        run: |
          chmod +x scripts/env-config.sh scripts/test-env-config.sh
          ./scripts/test-env-config.sh

      - name: 旧卷迁移逻辑测试
        run: |
          chmod +x scripts/migrate-home.sh scripts/test-migrate-home.sh
          ./scripts/test-migrate-home.sh

      - name: 管理面板离线测试
        run: |
          chmod +x admin/test-admin.sh
          ./admin/test-admin.sh

      - name: 管理面板单元测试
        working-directory: admin
        run: |
          set -eux
          # 先把格式与静态检查卡住，再跑测试：这两步只要几秒，能挡掉低级问题
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: 可执行位守卫
        run: |
          set -eu
          # git 只跟踪「可执行位」，但它决定脚本能否直接运行：
          #   * 误加可执行位 → 工作区出现一堆「已修改」而 diff 为空（宿主 umask 过宽时极易发生）
          #   * 误删可执行位 → ./install.sh、./dshm 直接跑不起来
          # 两侧都卡住：非脚本不得带可执行位，脚本必须带。
          bad=0
          while read -r mode path; do
            [ "$mode" = "100755" ] || continue
            case "$path" in
              *.sh | dshm) ;;
              *)
                echo "::error file=$path::非脚本文件被标记为可执行（应为 100644）"
                bad=1
                ;;
            esac
          done < <(git ls-files -s | awk '{print $1, $4}')

          for f in dshm install.sh entrypoint.sh scripts/*.sh; do
            [ -e "$f" ] || continue
            m="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [ "$m" != "100755" ]; then
              echo "::error file=$f::脚本缺少可执行位（应为 100755，实际 ${m:-未跟踪}）"
              bad=1
            fi
          done
          [ "$bad" = "0" ]

      - name: 代理注入单元测试
        run: |
          cd proxy
          npm install --omit=dev --no-fund --no-audit
          node test-inject.js

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-test:smoke
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha

      - name: 冒烟测试
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh dsh-test:smoke

  # 打 tag 时发布宿主用的静态二进制，供 ./dshm admin install（宿主模式）下载
  release-admin:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod
      - name: 交叉编译 dsh-admin
        working-directory: admin
        run: |
          set -eux
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dsh-admin-linux-${arch}" .
            sha256sum "dsh-admin-linux-${arch}" > "dsh-admin-linux-${arch}.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            admin/dsh-admin-linux-amd64
            admin/dsh-admin-linux-amd64.sha256
            admin/dsh-admin-linux-arm64
            admin/dsh-admin-linux-arm64.sha256

