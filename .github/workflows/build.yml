name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 多架构构建并推送 GHCR（PR 不推送）
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          echo "dsh=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
          echo "gate=$(grep -oP 'ARG AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.dsh }}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 单架构构建 + 真实起容器冒烟（PR 也跑）
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          echo "dsh=$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
          echo "gate=$(grep -oP 'ARG AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 离线检查先跑：不需要 docker，几秒出结果，避免白等一轮镜像构建。
      - name: 工作区预检离线测试
        run: |
          chmod +x scripts/preflight.sh scripts/test-preflight.sh
          ./scripts/test-preflight.sh

      - name: 代理注入单元测试
        run: |
          cd proxy
          npm install --omit=dev --no-fund --no-audit
          node test-inject.js

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-test:smoke
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha

      - name: 冒烟测试
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh dsh-test:smoke
