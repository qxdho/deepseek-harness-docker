name: build-image

# 构建多架构镜像并推送到 GHCR。
# 这样 1Panel 编排只需 `image:` 拉取，不必在服务器上放源码构建。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取 dsh 版本
        id: ver
        run: |
          # 版本以 Dockerfile 的默认 ARG 为准，避免两处不一致
          V=$(grep -oP 'ARG DSH_VERSION=\K.*' Dockerfile | head -1 | tr -d '\r')
          echo "dsh_version=$V" >> "$GITHUB_OUTPUT"
          echo "检测到 DSH_VERSION=$V"

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.dsh_version }}
            type=ref,event=tag

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 覆盖绝大多数服务器；arm64 供 Apple Silicon / 部分 NAS
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
