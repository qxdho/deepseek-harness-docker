name: build

on:
  push:
    branches: [main]
    # 两类 tag 都要匹配，否则镜像 tag 连 workflow 都不会触发：
    #   v*          dshm 自己的发布 tag（v2026.10.01-2）
    #   [0-9]*      镜像 tag（0.2.0-rc.2-2026.10.01-2）—— 以 dsh 版本号开头
    # 各作业再用 if 区分自己该不该跑（见下方 build-* / release-admin）。
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      delete_tags:
        description: '要删除的 GHCR tag（空格分隔），留空则只做常规构建'
        required: false
        default: ''

# 同一个 ref 上不并行跑两次（后到的排队），但**不取消正在运行的运行**：
# 多架构构建被半路掐断，GHCR 上可能只推了一半的 tag，比排队更糟。
# 曾经写成 `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`，
# 实测 push 时也会取消前一次运行（867c388 的 build 就这样被掐掉）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先判断这次改动到底要不要构建镜像。纯文档 / 纯 CI 配置的改动跑完整套（多架构构建
  # 加三个冒烟脚本）纯属浪费 —— 那是每次运行里最重的部分。注意：判断逻辑本身只依赖
  # 路径，不依赖构建结果。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      admin: ${{ steps.f.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要拿父提交做 diff，浅克隆（默认 fetch-depth=1）拿不到
          fetch-depth: 0
      - id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base=""
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # 首次推送 / force push 时 before 可能是全 0，取不到 diff：保守地当作
          # 有代码改动、且 admin 也可能变了，宁可不跳。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "取不到基线提交，按「有代码改动」处理"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "改动文件："; printf '%s\n' "$files" | sed 's/^/  /'
          # 只改这些就跳过镜像构建：Markdown、LICENSE、.gitignore/.dockerignore，
          # 以及 .github/ 下的**非 workflow** 文件（如 ISSUE 模板）。
          #
          # 注意不能把 .github/ 整个当作「不影响代码」：workflow 文件里放的是发布逻辑
          # 本身，改了它却不跑一遍，等于这部分改动永远不被验证 —— 这个坑真踩过一次
          # （改了 latest release 的上传逻辑，结果 build/release-admin 全被跳过）。
          code=false
          # 面板相关的两个测试（离线 + go 单测）合计约 20s，只在 admin/ 或本 workflow
          # 改动时才跑 —— 它们只验证 admin 这个程序，与镜像内容无关。
          admin=false
          # 用进程替换而不是 `done <<EOF`：heredoc 的结束符 `EOF` 在 YAML 块标量里
          # 无法放在行首（会被缩进），既让 shellcheck 报「here document 未正确结束」，
          # 也让这里的意图变得含糊。进程替换没有这个问题，且循环仍在当前 shell 里跑
          # （code/admin 的赋值能保留下来）。
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
            admin/* | .github/workflows/*) admin=true ;;
            esac
            case "$p" in
            .github/workflows/*) code=true ;;
            *.md | LICENSE | .github/* | .gitignore | .dockerignore) ;;
            *) code=true ;;
            esac
          done < <(printf '%s\n' "$files")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "需要构建镜像：$code；需要跑面板测试：$admin"

  # 镜像构建：**只在打「镜像 tag」时进行，推 main 不构建。**
  #
  # 为什么推 main 不构建：多平台构建（arm64 在 x86 runner 上走 QEMU 模拟）要 6 分钟以上，
  # 占整条流水线耗时的 97%，而日常推 main 多数时候并不需要新镜像。改由打 tag 决定何时
  # 出镜像后，日常 CI 只剩 checks + release-admin，约 100 秒。
  #
  # 「镜像 tag」= 形如 <dsh版本>-<日期>-<序号>（0.2.0-rc.2-2026.10.01-1）。
  # ⚠ dshm 自己的发布 tag 是 v*（v2026.10.01-2），而**在 GitHub 事件里它的 head_branch
  # 就是该 tag 名**，同样匹配 refs/tags/*，所以要显式排除 v* —— 否则打 dshm tag 会顺带
  # 触发一次 6 分钟的镜像构建。
  #
  # 两个架构各跑在**原生 runner** 上（public 仓库的 arm64 runner 免费），并行完成后
  # 用一个 job 合并 manifest。这样彻底避开 QEMU 模拟 —— 那是原先最慢的一块。

  build-amd64:
    needs: changes
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          # 用 awk 提取而不是 grep -oP：BSD/macOS 的 grep 没有 -P，且无匹配时返回 1
          # 会让这一步直接失败。（dshm 里已改用同样的做法。）
          dsh="$(awk -F= '/^ARG DSH_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          gate="$(awk -F= '/^ARG DSH_AUTH_GATE_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先本地构建跑冒烟。**只 load、不推正式 tag** —— 冒烟没过就不该产出正式镜像。
      - name: 构建 amd64（仅本地，用于冒烟）
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag dsh-test:smoke \
            --build-arg "DSH_VERSION=${{ steps.ver.outputs.dsh }}" \
            --build-arg "DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}" \
            --cache-from type=gha,scope=amd64 \
            --cache-to type=gha,scope=amd64,mode=max \
            .

      - name: 冒烟测试
        run: ./scripts/smoke-test.sh dsh-test:smoke

      # 冒烟通过后才推。**只推单架构 tag**（带 commit），正式 tag 由 merge 作业统一生成，
      # 这样正式 tag 只会指向多平台 manifest，不会先出现一份「单架构的同名镜像」。
      - name: 推送单架构镜像（供合并）
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${REGISTRY}/${IMAGE_NAME}:amd64-${GITHUB_SHA::7}" \
            --build-arg "DSH_VERSION=${{ steps.ver.outputs.dsh }}" \
            --build-arg "DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}" \
            --cache-from type=gha,scope=amd64 \
            .

  build-arm64:
    needs: changes
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.changes.outputs.code == 'true'
    # 原生 arm64 runner（public 仓库免费）。**不用 QEMU** —— 在 x86 runner 上模拟 arm64
    # 是原先最慢的一块（多平台构建 369s 里大头在这里）。
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          # 用 awk 提取而不是 grep -oP：BSD/macOS 的 grep 没有 -P，且无匹配时返回 1
          # 会让这一步直接失败。（dshm 里已改用同样的做法。）
          dsh="$(awk -F= '/^ARG DSH_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          gate="$(awk -F= '/^ARG DSH_AUTH_GATE_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 arm64（供合并）
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --tag "${REGISTRY}/${IMAGE_NAME}:arm64-${GITHUB_SHA::7}" \
            --build-arg "DSH_VERSION=${{ steps.ver.outputs.dsh }}" \
            --build-arg "DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}" \
            --cache-from type=gha,scope=arm64 \
            --cache-to type=gha,scope=arm64,mode=max \
            .

  # 计算镜像 tag，并把两个单架构 manifest 合成一个多平台 manifest。
  # **只改引用，不重新构建** —— 两个架构已由上面的作业并行构建好。
  merge-manifests:
    needs: [changes, build-amd64, build-arm64]
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          # 用 awk 提取而不是 grep -oP：BSD/macOS 的 grep 没有 -P，且无匹配时返回 1
          # 会让这一步直接失败。（dshm 里已改用同样的做法。）
          dsh="$(awk -F= '/^ARG DSH_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          gate="$(awk -F= '/^ARG DSH_AUTH_GATE_VERSION=/{gsub(/[ \t\r]/, "", $2); print $2; exit}' Dockerfile)"
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      # 镜像 tag **直接用你推送的那个 tag**，不再重新算序号。
      #
      # 为什么不重算：本作业正是被「镜像 tag」推送触发的（条件是 refs/tags/ 且非 v*），
      # 那个 tag 名本身就是本次镜像的版本号。再按「当天已有几个」去算会得到别的值，
      # 而且 metadata 的 enable={{is_default_branch}} 在 tag ref 上不成立 —— 实测推
      # 0.2.0-rc.2-2026.10.01-2 时，正式版本 tag 压根没生成（只有 latest 与 sha）。
      - name: 取镜像 tag（即本次推送的 tag）
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [ -n "$tag" ] || { echo "取不到 tag 名" >&2; exit 1; }
          # 防御性检查：v* 是 dshm 的发布 tag，不该走到这里（作业条件已排除）。
          if [ "${tag#v}" != "$tag" ]; then
            echo "镜像 tag 不应以 v 开头（那是 dshm 的发布 tag，由 release-admin 处理）" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "镜像 tag：${tag}"
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest：让 `dshm version update` 与 `--to` 之外的路径能拿到最新镜像。
            # **不要**加 enable={{is_default_branch}} —— 本作业只在 tag 上运行，
            # 那个条件在 tag ref 上恒假，会导致 tag 一个都不生成。
            type=raw,value=latest
            # 主 tag：就是你推送的那个镜像 tag
            type=raw,value=${{ steps.tag.outputs.tag }}
            # 精确到提交，便于排查
            type=sha,format=short

      - name: 合并多平台 manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          amd="${REGISTRY}/${IMAGE_NAME}:amd64-${GITHUB_SHA::7}"
          arm="${REGISTRY}/${IMAGE_NAME}:arm64-${GITHUB_SHA::7}"
          echo "合并 $amd + $arm"
          # imagetools create 从两个单架构 manifest 派生多平台 manifest，只改引用不重建。
          # 多个正式 tag 一次生成（--tag 可重复）。
          while IFS= read -r t; do
            if [ -n "$t" ]; then
              echo "  → $t"
              docker buildx imagetools create --tag "$t" "$amd" "$arm"
            fi
          done <<< "$TAGS"
          echo "多平台 manifest 已生成"

  # 清理合并用的单架构 tag（:amd64-<sha> / :arm64-<sha>）。
  #
  # 单独一个作业、并用 needs 保证**只在合并成功后**才删：合并失败时留着这些 tag
  # 还能手动排查/补救；成功后它们就没用了，留着会每次构建多堆两个。
  cleanup-staging:
    needs: [merge-manifests]
    if: needs.merge-manifests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 删除单架构 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          for name in "amd64-${sha}" "arm64-${sha}"; do
            # 先按 tag 名找到对应的 package version，再删该 version。
            # 这里用 CI 自带的 GITHUB_TOKEN（带 packages: write），不需要个人 token。
            vid="$(gh api \
              "users/qxdho/packages/container/deepseek-harness-docker/versions?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | index(\"${name}\")) | .id" 2>/dev/null | head -1 || true)"
            if [ -n "$vid" ]; then
              gh api -X DELETE \
                "users/qxdho/packages/container/deepseek-harness-docker/versions/${vid}" \
                >/dev/null 2>&1 && echo "已删除 ${name}（version ${vid}）" \
                || echo "::warning::删除 ${name} 失败（不影响发布）"
            else
              echo "未找到 ${name}，跳过"
            fi
          done

  # 手动清理指定的 GHCR tag（workflow_dispatch）。
  #
  # 用途：清掉历史遗留的临时 tag —— 例如「按架构构建」方案落地之前留下的
  # amd64-<sha> / arm64-<sha>，或是验证流程时打的测试镜像 tag。
  # 平时的临时 tag 由 cleanup-staging 自动清，这个入口只处理历史遗留。
  #
  # 为什么用这个作业而不是本地 curl：删除 package version 需要 token 有
  # read/delete packages 权限，个人 PAT 常常没有（实测 403）；CI 自带的
  # GITHUB_TOKEN 在本仓库有 packages: write，可以删。
  cleanup-versions:
    if: github.event_name == 'workflow_dispatch' && inputs.delete_tags != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 删除指定 tag 对应的 package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_TAGS: ${{ inputs.delete_tags }}
        run: |
          set -euo pipefail
          api="users/qxdho/packages/container/deepseek-harness-docker/versions"
          for name in $DELETE_TAGS; do
            vid="$(gh api "${api}?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | index(\"${name}\")) | .id" 2>/dev/null | head -1 || true)"
            if [ -n "$vid" ]; then
              if gh api -X DELETE "${api}/${vid}" >/dev/null 2>&1; then
                echo "已删除 ${name}（version ${vid}）"
              else
                echo "::error::删除 ${name} 失败"
                exit 1
              fi
            else
              echo "未找到 ${name}"
            fi
          done
  checks:
    needs: changes
    # 只在推 main 与 PR 上跑，**tag 推送时跳过**：tag 通常正指向刚推过的那个提交，
    # 同一份代码的检查在 main 那次已经跑过了，再跑一遍纯属重复（约 50 秒）。
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod


      # 离线检查先跑：不需要 docker，几秒出结果，避免白等一轮镜像构建。
      #
      # 由 scripts/test-all.sh 自动发现并运行 scripts/test-*.sh —— 原来这里是 6 个
      # 逐字重复的步骤（各自 `chmod +x a.sh && ./b.sh`），新增测试还要记得加步骤。
      # 现在新增脚本会被自动跑到，CI 侧只有一个步骤。
      # 先校验 workflow 本身。**YAML 合法 ≠ workflow 合法**：GitHub Actions 还有一整套
      # 语义规则（表达式语法、needs 引用、step 键名……），光靠 yaml 解析器查不出来。
      # 这个坑真踩过：删掉一行 `needs.smoke.result == 'success'` 后，`if:` 变成以 `&&`
      # 结尾的悬空表达式 —— YAML 完全合法，动作全被 GitHub 拒绝执行（run 建了但 0 个作业，
      # 报错只写「failure」，极难定位）。actionlint 一跑就指到了具体行。
      - name: 校验 workflow（actionlint）
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

      # 再跑一遍不依赖 shellcheck 的内嵌脚本检查。
      #
      # actionlint 的 shellcheck 部分**依赖 runner 装了 shellcheck**；本地往往没装，
      # 于是 actionlint「静默通过」而 CI 报错 —— 这个坑踩过两次。本脚本用 bash -n 与
      # 形态扫描覆盖语法层面，任何环境都能跑。
      - name: 校验 workflow 内嵌脚本
        run: ./scripts/check-workflow.sh

      - name: 离线测试（自动发现 scripts/test-*.sh）
        run: ./scripts/test-all.sh -v
      - name: 管理面板离线测试
        if: needs.changes.outputs.admin == 'true'
        run: |
          chmod +x admin/test-admin.sh
          ./admin/test-admin.sh

      - name: 管理面板单元测试
        if: needs.changes.outputs.admin == 'true'
        working-directory: admin
        run: |
          set -eux
          # 先把格式与静态检查卡住，再跑测试：这两步只要几秒，能挡掉低级问题
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: 可执行位守卫
        run: |
          set -eu
          # git 只跟踪「可执行位」，但它决定脚本能否直接运行：
          #   * 误加可执行位 → 工作区出现一堆「已修改」而 diff 为空（宿主 umask 过宽时极易发生）
          #   * 误删可执行位 → ./install.sh、./dshm 直接跑不起来
          # 两侧都卡住：非脚本不得带可执行位，脚本必须带。
          bad=0
          while read -r mode path; do
            [ "$mode" = "100755" ] || continue
            case "$path" in
              *.sh | dshm) ;;
              *)
                echo "::error file=$path::非脚本文件被标记为可执行（应为 100644）"
                bad=1
                ;;
            esac
          done < <(git ls-files -s | awk '{print $1, $4}')

          for f in dshm install.sh entrypoint.sh scripts/*.sh; do
            [ -e "$f" ] || continue
            m="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [ "$m" != "100755" ]; then
              echo "::error file=$f::脚本缺少可执行位（应为 100755，实际 ${m:-未跟踪}）"
              bad=1
            fi
          done
          [ "$bad" = "0" ]

      - name: 代理注入单元测试
        run: |
          # `|| exit` 不能省：cd 失败时若不退出，npm install 会在错误目录里执行（shellcheck SC2164）。
          cd proxy || exit 1
          npm install --omit=dev --no-fund --no-audit
          node test-inject.js
  # 管理面板二进制。安装脚本从 releases/latest/download/... 拉取，所以**必须**在推
  # main 时也发布 —— 只在打 tag 时发的话，没有 tag 的仓库永远没有可下载的产物，
  # `dshm admin install` 就会一路回退到「本机 Go 构建」并最终失败。
  release-admin:
    needs: changes
    # 面板二进制只由 admin/ 决定，但「哪些文件变了」的判断在 changes 作业里，为简洁
    # 复用同一个 code 输出：纯文档改动不重发（二进制与上一次代码推送时完全一致，
    # 已在 latest release 里，跳过不影响安装）。
    #
    # 触发条件覆盖两类 tag：
    #   * dshm 发布 tag（v*）              → 发该 tag 的 release（dshm 包 + 面板二进制）
    #   * 镜像 tag（<dsh版本>-<日期>-<序号>）→ 也发 release，这样
    #     `dshm dshm update --to <镜像tag>` 能拿到 dshm 包（否则那个 tag 下只有镜像，会 404）
    # 推 main 时也发一次，只为刷新固定的 latest release（供没打 tag 的部署机装面板）。
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 一致性校验放在最前面：tag 必须等于 v + VERSION。
      #
      # 包名、release 下载地址、脚本里写死的版本号全从这一个号派生。两者脱节（例如 tag 是
      # v2026.10.01-1 而 VERSION 还是 2026.10.01）会发出一个「包名对不上、自更新 404」的
      # release —— 而且从产物上很难看出来。放最前面是为了在**编译 Go 之前**就失败。
      - name: 校验 tag 与 VERSION 一致
        run: |
          set -eu
          # 只对 **dshm 发布 tag（v*）** 校验：那类 tag 的名字就是 VERSION 的内容。
          # 镜像 tag（<dsh版本>-<日期>-<序号>）与 VERSION 无关，跳过 —— 否则它一触发
          # 本作业就必然失败（这也正是早先把它排除在外的原因）。
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "非 tag 推送，跳过一致性校验"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
          v*) ;;
          *)
            echo "镜像 tag（${GITHUB_REF_NAME}）不参与 VERSION 一致性校验"
            exit 0
            ;;
          esac
          NUM="$(tr -d ' \t\r\n' < VERSION)"
          [ -n "$NUM" ] || { echo "读不到 VERSION" >&2; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${NUM}" ]; then
            echo "::error::tag 与 VERSION 不一致：tag=${GITHUB_REF_NAME}，VERSION=${NUM}（应为 v${NUM}）" >&2
            echo "  发布流程：先改 VERSION 并提交，再打同名 tag。" >&2
            exit 1
          fi
          echo "版本一致性 OK（VERSION=${NUM}，ref=${GITHUB_REF_NAME}）"

      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod
      - name: 交叉编译 dsh-admin
        working-directory: admin
        run: |
          set -eux
          # 版本号从仓库根的 VERSION 读 —— 那是 dshm 与面板的**唯一真源**，
          # 所以「面板是 dshm 的附属功能、两者同版本」由机制保证，不靠人记。
          # 在仓库根执行时 tag 名形如 v2026.09.30，这里加上 v 前缀保持一致。
          VER="v$(tr -d ' \t\r\n' < ../VERSION)"
          # 用 if 而不是「与运算接或运算」的简写（shellcheck SC2015）：那种写法不是
          # if-then-else —— 前半成立但中间那条命令本身失败时，兜底分支也会执行，
          # 于是「读到了 VERSION」却被报成「读不到」。
          if [ -z "$VER" ] || [ "$VER" = "v" ]; then
            echo "读不到 VERSION" >&2
            exit 1
          fi
          echo "注入版本：$VER（供 dsh-admin -version 与面板「自身版本」使用）"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.adminVersion=${VER}" \
              -o "dsh-admin-linux-${arch}" .
            sha256sum "dsh-admin-linux-${arch}" > "dsh-admin-linux-${arch}.sha256"
          done
      # 生成发布包（dshm 的完整运行目录），作为 release 产物。
      #
      # 为什么要打包而不是只发一个 dshm 文件：dshm 会 source 同目录下的
      # scripts/env-config.sh、scripts/migrate-home.sh、scripts/admin.sh —— 单独一个
      # 脚本文件在任何地方都跑不起来。而 `dshm dshm update` 面向的是没保留 git 仓库的
      # 部署机，它没有这些文件，所以必须交付完整目录。
      #
      # 同时把版本号写死：仓库里的 dshm 用 __VERSION__ 占位符，靠 git / VERSION 文件
      # 推断版本；部署机两者都没有，不替换的话版本号会退化成 dev。
      #
      # 注意要替换**两处**：赋值，以及 dshm_version() 里判断「占位符还在不在」的比较。
      # 只替换赋值会让那个判断永远为真，绕过版本号去走 git / VERSION 分支。
      - name: 生成发布包
        run: |
          set -eu
          NUM="$(tr -d ' \t\r\n' < VERSION)"
          [ -n "$NUM" ] || { echo "读不到 VERSION" >&2; exit 1; }
          # 一致性已在作业开头校验过（那样能在编译 Go 之前就失败），这里不再重复。
          # 包名从**本次推送的 tag 名**派生，而不是按 VERSION 拼 `v${NUM}`：
          # 镜像 tag（0.2.0-rc.2-2026.10.01-3）不带 v 前缀，按 VERSION 拼会得到另一个名字，
          # 于是 `dshm dshm update --to <镜像tag>` 永远 404。
          # 统一规则：包名 = dshm-<tag>.tar.gz —— tag 名是唯一标识。
          # 一致性已在作业开头校验过（那样能在编译 Go 之前就失败），这里不再重复。
          pkg="dshm-${GITHUB_REF_NAME}"
          rm -rf "$pkg"
          mkdir -p "$pkg/scripts"
          sed -e "s|^DSHM_VERSION_RAW=.*|DSHM_VERSION_RAW=\"\${DSHM_VERSION:-${NUM}}\"|" \
              -e "s|^\(\s*\)if \[ \"\$DSHM_VERSION_RAW\" != \"__VERSION__\" \]; then|\1if true; then|" \
            dshm > "$pkg/dshm"
          # 校验：赋值行已写死版本号，且「占位符还在不在」的判断已被改成恒真，
          # 让 dshm_version 直接返回这个版本号（发布版没有 git 也没有 VERSION 文件，
          # 一旦落到后面的推断分支就会显示成 dev）
          grep -q "DSHM_VERSION_RAW=\"\${DSHM_VERSION:-${NUM}}\"" "$pkg/dshm" \
            || { echo "::error::赋值行未替换" >&2; exit 1; }
          grep -q 'if true; then' "$pkg/dshm" \
            || { echo "::error::版本判断未替换（脚本会把自己当未发布版）" >&2; exit 1; }
          bash -n "$pkg/dshm" || { echo "::error::替换后语法有误" >&2; exit 1; }
          # dshm 运行所需的同目录文件，缺一不可
          cp scripts/env-config.sh scripts/migrate-home.sh scripts/admin.sh "$pkg/scripts/"
          # 不带 VERSION 文件：版本号已写死在脚本里，留着反而多一个会过期的来源
          chmod +x "$pkg/dshm"
          tar -czf "${pkg}.tar.gz" "$pkg"
          # 解包自检：确认包内容完整、脚本语法正确
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar -xzf "${pkg}.tar.gz" -C /tmp/verify
          for f in dshm scripts/env-config.sh scripts/migrate-home.sh scripts/admin.sh; do
            [ -f "/tmp/verify/${pkg}/${f}" ] || { echo "::error::发布包缺少 ${f}" >&2; exit 1; }
          done
          bash -n "/tmp/verify/${pkg}/dshm"
          rm -rf /tmp/verify
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          echo "已生成 ${pkg}.tar.gz（$(wc -c < "${pkg}.tar.gz") 字节，版本 ${NUM}）"

      # tag 推送：每个版本一个 release（softprops 会按 tag 创建）
      # 打 tag 时发布该 tag 的 release（dshm 包 + 面板二进制）。
      # 包名的两种形态：dshm tag → dshm-v<版本>.tar.gz；镜像 tag → dshm-<tag>.tar.gz。
      # 用 `dshm-*.tar.gz` 而不是 `dshm-*`：后者会把生成发布包时留下的**目录**
      # dshm-<tag>/ 也算进去，gh 会试图上传目录并报 "is a directory"。
      - name: 发布到该 tag 的 release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            admin/dsh-admin-linux-amd64
            admin/dsh-admin-linux-amd64.sha256
            admin/dsh-admin-linux-arm64
            admin/dsh-admin-linux-arm64.sha256
            dshm-*.tar.gz
            dshm-*.tar.gz.sha256
      # main 推送：更新固定的 latest release。
      # 不能用 softprops 直接对 latest 做（并发会 422），先用 gh release create 保证它
      # 存在（已存在则忽略），再 --clobber 覆盖附件。一个步骤里循环重试，避免并发下
      # 两个 run 同时创建时刷出红色失败。
      - name: 更新 latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag=latest
          # 用**精确文件名**，不要用 dshm-* 通配：那个模式会匹配到生成发布包时留下的
          # 目录 dshm-v<版本>/，gh 会试图把目录当附件上传，报
          #   read dshm-v<版本>: is a directory
          # 然后重试三次全败、整个 job 变红。这个坑很难从报错本身看出来。
          VER="v$(tr -d ' \t\r\n' < VERSION)"
          # 用 if 而不是「与运算接或运算」的简写（shellcheck SC2015）：那种写法不是
          # if-then-else —— 前半成立但中间那条命令本身失败时，兜底分支也会执行，
          # 于是「读到了 VERSION」却被报成「读不到」。
          if [ -z "$VER" ] || [ "$VER" = "v" ]; then
            echo "读不到 VERSION" >&2
            exit 1
          fi
          PKG="dshm-${VER}.tar.gz"
          [ -f "$PKG" ] || { echo "::error::找不到 $PKG" >&2; exit 1; }
          [ -f "${PKG}.sha256" ] || { echo "::error::找不到 ${PKG}.sha256" >&2; exit 1; }

          for i in 1 2 3; do
            # 用 if 而不是「或运算接或运算」的链式简写（shellcheck SC2015）。
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "latest（main 最新构建）" \
                --notes "由 main 分支自动更新，供安装脚本从 releases/latest 拉取。" \
                >/dev/null 2>&1 || true
            fi

            # 先清掉 latest 里的历史发布包。否则每发一个版本就多留一份，latest 会一直
            # 堆积；--clobber 只覆盖同名文件，管不了旧版本名。
            gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null |
              grep -E '^dshm-.*\.tar\.gz(\.sha256)?$' |
              while read -r old; do
                # 用 if 而不是「与运算接或运算接 true」的简写（shellcheck SC2015）。
                if gh release delete-asset "$tag" "$old" --yes 2>/dev/null; then
                  echo "已清理旧包：$old"
                fi
              done

            if gh release upload "$tag" \
                 admin/dsh-admin-linux-amd64 \
                 admin/dsh-admin-linux-amd64.sha256 \
                 admin/dsh-admin-linux-arm64 \
                 admin/dsh-admin-linux-arm64.sha256 \
                 "$PKG" "${PKG}.sha256" \
                 --clobber; then
              echo "已将面板二进制与 $PKG 更新到 latest release"
              exit 0
            fi
            echo "上传失败，第 $i 次重试…" >&2
            sleep 5
          done
          echo "::error::多次重试后仍无法更新 latest release" >&2
          exit 1

