name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个 ref 上只保留最新一次运行：main 上连续 push 时，旧的那次推镜像已无意义，
# PR 更是改一次就作废一次。tag 运行不取消（发布必须完整跑完）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 多架构构建并推送 GHCR（PR 不推送）
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.dsh }}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 单架构构建 + 真实起容器冒烟（PR 也跑）
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - uses: docker/setup-buildx-action@v3

      # 离线检查先跑：不需要 docker，几秒出结果，避免白等一轮镜像构建。
      - name: 工作区预检离线测试
        run: |
          chmod +x scripts/preflight.sh scripts/test-preflight.sh
          ./scripts/test-preflight.sh

      - name: .env 配置项逻辑测试
        run: |
          chmod +x scripts/env-config.sh scripts/test-env-config.sh
          ./scripts/test-env-config.sh

      - name: 旧卷迁移逻辑测试
        run: |
          chmod +x scripts/migrate-home.sh scripts/test-migrate-home.sh
          ./scripts/test-migrate-home.sh

      - name: 管理面板离线测试
        run: |
          chmod +x admin/test-admin.sh
          ./admin/test-admin.sh

      - name: 管理面板单元测试
        working-directory: admin
        run: |
          set -eux
          # 先把格式与静态检查卡住，再跑测试：这两步只要几秒，能挡掉低级问题
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: 代理注入单元测试
        run: |
          cd proxy
          npm install --omit=dev --no-fund --no-audit
          node test-inject.js

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-test:smoke
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha

      - name: 冒烟测试
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh dsh-test:smoke

  # 打 tag 时发布宿主用的静态二进制，供 ./dshm admin install（宿主模式）下载
  release-admin:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod
      - name: 交叉编译 dsh-admin
        working-directory: admin
        run: |
          set -eux
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dsh-admin-linux-${arch}" .
            sha256sum "dsh-admin-linux-${arch}" > "dsh-admin-linux-${arch}.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            admin/dsh-admin-linux-amd64
            admin/dsh-admin-linux-amd64.sha256
            admin/dsh-admin-linux-arm64
            admin/dsh-admin-linux-arm64.sha256

