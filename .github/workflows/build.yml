name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个 ref 上不并行跑两次（后到的排队），但**不取消正在运行的运行**：
# 多架构构建被半路掐断，GHCR 上可能只推了一半的 tag，比排队更糟。
# 曾经写成 `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`，
# 实测 push 时也会取消前一次运行（867c388 的 build 就这样被掐掉）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先判断这次改动到底要不要构建镜像。纯文档 / 纯 CI 配置的改动跑完整套（多架构构建
  # 加三个冒烟脚本）纯属浪费 —— 那是每次运行里最重的部分。注意：判断逻辑本身只依赖
  # 路径，不依赖构建结果。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      admin: ${{ steps.f.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要拿父提交做 diff，浅克隆（默认 fetch-depth=1）拿不到
          fetch-depth: 0
      - id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base=""
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # 首次推送 / force push 时 before 可能是全 0，取不到 diff：保守地当作
          # 有代码改动、且 admin 也可能变了，宁可不跳。
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "取不到基线提交，按「有代码改动」处理"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "改动文件："; printf '%s\n' "$files" | sed 's/^/  /'
          # 只改这些就跳过镜像构建：Markdown、LICENSE、CI 配置本身、.gitignore/.dockerignore
          code=false
          # 面板相关的两个测试（离线 + go 单测）合计约 20s，只在 admin/ 或本 workflow
          # 改动时才跑 —— 它们只验证 admin 这个程序，与镜像内容无关。
          admin=false
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
            admin/* | .github/workflows/build.yml) admin=true ;;
            esac
            case "$p" in
            *.md | LICENSE | .github/* | .gitignore | .dockerignore) ;;
            *) code=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "需要构建镜像：$code；需要跑面板测试：$admin"

  # 多架构构建并推送 GHCR（PR 不推送）。
  #
  # 依赖 smoke：串行后总墙钟更短（不做两遍重复构建），而且不会把冒烟没过的镜像
  # 推成 latest。`changes` 也必须列进 needs —— 引用了它的 output 就得声明依赖。
  build:
    needs: [changes, smoke]
    if: |
      github.event_name != 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG DSH_AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      # 镜像 tag = <dsh版本>-<日期>-<序号>，例如 0.2.0-rc.2-2026.09.30-1
      #   * 带 dsh 版本 → 一眼看出镜像里是哪个 dsh
      #   * 带日期      → 看出是哪天的构建
      #   * 带序号      → 同一天多次构建互不覆盖，旧镜像仍可回退
      # 为什么必须有序号：tag 一旦被同名覆盖，旧镜像就失去引用、可能被回收，回退就没了。
      # 这正是原先那个「纯 dsh 版本 tag」的坑，所以它被移除了。
      - name: 计算镜像 tag
        id: tag
        run: |
          set -euo pipefail
          dsh="${{ steps.ver.outputs.dsh }}"
          day="$(date -u +%Y.%m.%d)"
          n=0
          # 用 GHCR 的**匿名** pull token 列已有 tag —— 不需要任何密钥，
          # 只读取公开包的 tag 列表。
          if token="$(curl -fsSL --max-time 20 \
              "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
              | grep -oE '"token":"[^"]+"' | cut -d'"' -f4)" && [ -n "$token" ]; then
            existing="$(curl -fsSL --max-time 20 -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" 2>/dev/null || true)"
            n="$(printf '%s' "$existing" |
              sed -n 's/.*"tags":\[\(.*\)\]}.*/\1/p' | tr ',' '\n' |
              grep -cE "^${dsh}-${day}-[0-9]+$" || true)"
          else
            echo "::warning::列不到已有 tag，序号从 1 开始（可能覆盖同名 tag）"
          fi
          [ -n "$n" ] || n=0
          img_tag="${dsh}-${day}-$((n + 1))"
          echo "tag=${img_tag}" >> "$GITHUB_OUTPUT"
          echo "镜像 tag：${img_tag}（当天该 dsh 版本已有 ${n} 个构建）"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # 主 tag：<dsh版本>-<日期>-<序号>，唯一、不覆盖旧镜像（可回退）
            type=raw,value=${{ steps.tag.outputs.tag }},enable={{is_default_branch}}
            # 精确到提交，便于排查；同一提交重复构建内容可能不同，故不作为版本依据
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 单架构构建 + 真实起容器冒烟（PR 也跑）
  smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取内置版本
        id: ver
        run: |
          set -euo pipefail
          dsh="$(grep -oP 'ARG DSH_VERSION=\K\S+' Dockerfile | head -1)"
          gate="$(grep -oP 'ARG DSH_AUTH_GATE_VERSION=\K\S+' Dockerfile | head -1)"
          # 读不到就会生成空 tag / 空构建参数（装成 latest），必须在这里就失败
          [ -n "$dsh" ] || { echo "Dockerfile 里读不到 ARG DSH_VERSION" >&2; exit 1; }
          [ -n "$gate" ] || { echo "Dockerfile 里读不到 ARG DSH_AUTH_GATE_VERSION" >&2; exit 1; }
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod

      - uses: docker/setup-buildx-action@v3

      # 离线检查先跑：不需要 docker，几秒出结果，避免白等一轮镜像构建。
      - name: 工作区预检离线测试
        run: |
          chmod +x scripts/preflight.sh scripts/test-preflight.sh
          ./scripts/test-preflight.sh

      - name: .env 配置项逻辑测试
        run: |
          chmod +x scripts/env-config.sh scripts/test-env-config.sh
          ./scripts/test-env-config.sh

      - name: 旧卷迁移逻辑测试
        run: |
          chmod +x scripts/migrate-home.sh scripts/test-migrate-home.sh
          ./scripts/test-migrate-home.sh

      - name: dsh 版本解析测试
        run: |
          chmod +x scripts/test-dshm-versions.sh
          ./scripts/test-dshm-versions.sh

      - name: dshm 自身版本与 tag 测试
        run: |
          chmod +x scripts/test-dshm-self.sh
          ./scripts/test-dshm-self.sh

      - name: 版本更新脚本测试
        run: |
          chmod +x scripts/update-versions.sh scripts/test-update-versions.sh
          ./scripts/test-update-versions.sh

      - name: 管理面板离线测试
        if: needs.changes.outputs.admin == 'true'
        run: |
          chmod +x admin/test-admin.sh
          ./admin/test-admin.sh

      - name: 管理面板单元测试
        if: needs.changes.outputs.admin == 'true'
        working-directory: admin
        run: |
          set -eux
          # 先把格式与静态检查卡住，再跑测试：这两步只要几秒，能挡掉低级问题
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: 可执行位守卫
        run: |
          set -eu
          # git 只跟踪「可执行位」，但它决定脚本能否直接运行：
          #   * 误加可执行位 → 工作区出现一堆「已修改」而 diff 为空（宿主 umask 过宽时极易发生）
          #   * 误删可执行位 → ./install.sh、./dshm 直接跑不起来
          # 两侧都卡住：非脚本不得带可执行位，脚本必须带。
          bad=0
          while read -r mode path; do
            [ "$mode" = "100755" ] || continue
            case "$path" in
              *.sh | dshm) ;;
              *)
                echo "::error file=$path::非脚本文件被标记为可执行（应为 100644）"
                bad=1
                ;;
            esac
          done < <(git ls-files -s | awk '{print $1, $4}')

          for f in dshm install.sh entrypoint.sh scripts/*.sh; do
            [ -e "$f" ] || continue
            m="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [ "$m" != "100755" ]; then
              echo "::error file=$f::脚本缺少可执行位（应为 100755，实际 ${m:-未跟踪}）"
              bad=1
            fi
          done
          [ "$bad" = "0" ]

      - name: 代理注入单元测试
        run: |
          cd proxy
          npm install --omit=dev --no-fund --no-audit
          node test-inject.js

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-test:smoke
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            DSH_AUTH_GATE_VERSION=${{ steps.ver.outputs.gate }}
          cache-from: type=gha

      - name: 冒烟测试
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh dsh-test:smoke

  # 打 tag 时发布宿主用的静态二进制，供 ./dshm admin install（宿主模式）下载
  # 管理面板二进制。安装脚本从 releases/latest/download/... 拉取，所以**必须**在推
  # main 时也发布 —— 只在打 tag 时发的话，没有 tag 的仓库永远没有可下载的产物，
  # `dshm admin install` 就会一路回退到「本机 Go 构建」并最终失败。
  release-admin:
    needs: changes
    # 面板二进制只由 admin/ 决定，但「哪些文件变了」的判断在 changes 作业里，为简洁
    # 复用同一个 code 输出：纯文档改动不重发（二进制与上一次代码推送时完全一致，
    # 已在 latest release 里，跳过不影响安装）。打 tag 时无条件发，保证版本产物齐全。
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: admin/go.mod
      - name: 交叉编译 dsh-admin
        working-directory: admin
        run: |
          set -eux
          # 版本号从仓库根的 VERSION 读 —— 那是 dshm 与面板的**唯一真源**，
          # 所以「面板是 dshm 的附属功能、两者同版本」由机制保证，不靠人记。
          # 在仓库根执行时 tag 名形如 v2026.09.30，这里加上 v 前缀保持一致。
          VER="v$(tr -d ' \t\r\n' < ../VERSION)"
          [ -n "$VER" ] && [ "$VER" != "v" ] || { echo "读不到 VERSION" >&2; exit 1; }
          echo "注入版本：$VER（供 dsh-admin -version 与面板「自身版本」使用）"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.adminVersion=${VER}" \
              -o "dsh-admin-linux-${arch}" .
            sha256sum "dsh-admin-linux-${arch}" > "dsh-admin-linux-${arch}.sha256"
          done
      # 生成发布包（dshm 的完整运行目录），作为 release 产物。
      #
      # 为什么要打包而不是只发一个 dshm 文件：dshm 会 source 同目录下的
      # scripts/env-config.sh、scripts/migrate-home.sh、scripts/admin.sh —— 单独一个
      # 脚本文件在任何地方都跑不起来。而 `dshm dshm update` 面向的是没保留 git 仓库的
      # 部署机，它没有这些文件，所以必须交付完整目录。
      #
      # 同时把版本号写死：仓库里的 dshm 用 __VERSION__ 占位符，靠 git / VERSION 文件
      # 推断版本；部署机两者都没有，不替换的话版本号会退化成 dev。
      #
      # 注意要替换**两处**：赋值，以及 dshm_version() 里判断「占位符还在不在」的比较。
      # 只替换赋值会让那个判断永远为真，绕过版本号去走 git / VERSION 分支。
      - name: 生成发布包
        run: |
          set -eu
          VER="v$(tr -d ' \t\r\n' < VERSION)"
          [ -n "$VER" ] && [ "$VER" != "v" ] || { echo "读不到 VERSION" >&2; exit 1; }
          NUM="${VER#v}"
          pkg="dshm-${VER}"
          rm -rf "$pkg"
          mkdir -p "$pkg/scripts"
          sed -e "s|^DSHM_VERSION_RAW=.*|DSHM_VERSION_RAW=\"\${DSHM_VERSION:-${NUM}}\"|" \
              -e "s|^\(\s*\)if \[ \"\$DSHM_VERSION_RAW\" != \"__VERSION__\" \]; then|\1if true; then|" \
            dshm > "$pkg/dshm"
          # 校验：赋值行已写死版本号，且「占位符还在不在」的判断已被改成恒真，
          # 让 dshm_version 直接返回这个版本号（发布版没有 git 也没有 VERSION 文件，
          # 一旦落到后面的推断分支就会显示成 dev）
          grep -q "DSHM_VERSION_RAW=\"\${DSHM_VERSION:-${NUM}}\"" "$pkg/dshm" \
            || { echo "::error::赋值行未替换" >&2; exit 1; }
          grep -q 'if true; then' "$pkg/dshm" \
            || { echo "::error::版本判断未替换（脚本会把自己当未发布版）" >&2; exit 1; }
          bash -n "$pkg/dshm" || { echo "::error::替换后语法有误" >&2; exit 1; }
          # dshm 运行所需的同目录文件，缺一不可
          cp scripts/env-config.sh scripts/migrate-home.sh scripts/admin.sh "$pkg/scripts/"
          # 不带 VERSION 文件：版本号已写死在脚本里，留着反而多一个会过期的来源
          chmod +x "$pkg/dshm"
          tar -czf "${pkg}.tar.gz" "$pkg"
          # 解包自检：确认包内容完整、脚本语法正确
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar -xzf "${pkg}.tar.gz" -C /tmp/verify
          for f in dshm scripts/env-config.sh scripts/migrate-home.sh scripts/admin.sh; do
            [ -f "/tmp/verify/${pkg}/${f}" ] || { echo "::error::发布包缺少 ${f}" >&2; exit 1; }
          done
          bash -n "/tmp/verify/${pkg}/dshm"
          rm -rf /tmp/verify
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          echo "已生成 ${pkg}.tar.gz（$(wc -c < "${pkg}.tar.gz") 字节，版本 ${NUM}）"

      # tag 推送：每个版本一个 release（softprops 会按 tag 创建）
      - name: 发布到该 tag 的 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            admin/dsh-admin-linux-amd64
            admin/dsh-admin-linux-amd64.sha256
            admin/dsh-admin-linux-arm64
            admin/dsh-admin-linux-arm64.sha256
            dshm-v*.tar.gz
            dshm-v*.tar.gz.sha256
      # main 推送：更新固定的 latest release。
      # 不能用 softprops 直接对 latest 做（并发会 422），先用 gh release create 保证它
      # 存在（已存在则忽略），再 --clobber 覆盖附件。一个步骤里循环重试，避免并发下
      # 两个 run 同时创建时刷出红色失败。
      - name: 更新 latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag=latest
          for i in 1 2 3; do
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --title "latest（main 最新构建）" \
                   --notes "由 main 分支自动更新，供安装脚本从 releases/latest 拉取。" \
                   >/dev/null 2>&1 || true
            if gh release upload "$tag" \
                 admin/dsh-admin-linux-amd64 \
                 admin/dsh-admin-linux-amd64.sha256 \
                 admin/dsh-admin-linux-arm64 \
                 admin/dsh-admin-linux-arm64.sha256 \
                 dshm-* \
                 --clobber; then
              echo "已将面板二进制更新到 latest release"
              exit 0
            fi
            echo "上传失败，第 $i 次重试…" >&2
            sleep 5
          done
          echo "::error::多次重试后仍无法更新 latest release" >&2
          exit 1

