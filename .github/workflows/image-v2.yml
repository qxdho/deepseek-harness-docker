name: image-v2

# 构建并冒烟 v2 镜像（无代理，dsh-web-startup-auth）。
# 不发布、不接触任何现有部署。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - docker-compose.yml
      - scripts/**
      - dshm
      - templates/**
      - .github/workflows/image-v2.yml

permissions:
  contents: write

concurrency:
  group: image-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 构建 v2 镜像
        run: |
          set -euxo pipefail
          docker build -t dsh-v2:smoke .

      - name: 冒烟
        run: |
          set -euo pipefail
          bash scripts/smoke-v2.sh dsh-v2:smoke 2>&1 | tee "$RUNNER_TEMP/v2.log"

      - name: 失败时提交日志
        if: failure()
        run: |
          set -uxo pipefail
          cp "$RUNNER_TEMP/v2.log" v2-failure.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f v2-failure.txt || true
          git commit -m "chore(ci): v2 failure log [skip ci]" || true
          git push origin HEAD:main || true

      - name: 用 dshm 安装并管理一次
        run: |
          set -euo pipefail
          inst="$RUNNER_TEMP/dshm-instance"
          printf 'TestPassword123!\n' | ./dshm docker install \
            --dir "$inst" \
            --image dsh-v2:smoke \
            --no-pull \
            --password-stdin
          ./dshm --dir "$inst" docker status
          test "$(./dshm --dir "$inst" docker config get DSH_IMAGE)" = "dsh-v2:smoke"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/login)"
          [ "$code" = "200" ]
          ./dshm --dir "$inst" docker down
