# 1Panel 编排专用 compose（镜像版）
#
# 与仓库根目录那份的区别：
#   - 不 build，直接拉 GHCR 上的现成镜像（1Panel 编排无法方便地携带构建上下文）
#   - 端口默认只绑 127.0.0.1，由 1Panel 的「网站」反代提供 HTTPS
#
# 粘贴位置：1Panel → 容器 → 编排 → 创建编排
services:
  dsh:
    # 版本在 GitHub Actions 里按 Dockerfile 的 ARG 构建并打标签
    image: ghcr.io/qxdho/deepseek-harness-docker:0.1.7-rc.2
    container_name: dsh-own
    restart: unless-stopped

    ports:
      # 只绑回环：外部访问统一走 1Panel 的网站反代（HTTPS + 证书）。
      # 想先用 IP 直连快速验证，把 127.0.0.1 换成 0.0.0.0，
      # 并把 DSH_TRUSTED_HOSTS 填成 "服务器IP:3080"。
      - "127.0.0.1:3080:3080"

    environment:
      DSH_PORT: "3079"
      PROXY_PORT: "3080"

      # Basic Auth：两个都设置才生效；只设一个等于完全不认证。
      # 若已在 1Panel 网站里配了访问密码，这里可留空避免弹两次框。
      PROXY_USERNAME: "admin"
      PROXY_PASSWORD: "CHANGE_ME_至少12位"

      # 【必填】浏览器实际使用的地址，空格分隔多个。
      # 原因是代理保留原始 Host，dsh 的 /api 信任栅栏只接受回环地址和这里声明的。
      # 不填的症状：页面能打开，但所有 API 403、实时通道连不上。
      # 例：DSH_TRUSTED_HOSTS: "dsh.qxdho.top 192.168.1.10:3080"
      DSH_TRUSTED_HOSTS: "dsh.qxdho.top"

    volumes:
      # 会话、设置、凭证。命名卷由 Docker 管理，1Panel 升级容器时不受影响。
      - dsh-home:/home/node/.dsh
      # 工作区：1Panel 编排目录下的 workspace 子目录
      - ./workspace:/workspace

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s

volumes:
  dsh-home:
