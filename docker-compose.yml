services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.7-rc.2}
        # full = 额外装 python3/make/g++/vim/jq，用于容器内编译插件
        DEV_TOOLS: ${DEV_TOOLS:-none}
    image: dsh-own:${DSH_VERSION:-0.1.7-rc.2}
    container_name: dsh-own
    restart: unless-stopped

    ports:
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"

    environment:
      DSH_PORT: ${DSH_PORT:-3079}
      PROXY_PORT: ${PROXY_PORT:-3080}
      # Basic Auth：两个都设置才生效；只设一个等于完全不认证
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      # 关键：因为代理保留原始 Host，浏览器用的 authority 必须在这里声明，
      # 否则 dsh 的 /api 信任栅栏会 403（页面能开、接口全挂）。
      # 多个用空格分隔。用 127.0.0.1/localhost 访问时可留空。
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}

    volumes:
      - dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-./workspace}:/workspace

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s

volumes:
  dsh-home:
