services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/qxdho/deepseek-harness-docker:latest}
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.2-rc.1}
        DSH_WEB_AUTH_VERSION: ${DSH_WEB_AUTH_VERSION:-0.1.14}
        DSH_DEV_TOOLS: ${DSH_DEV_TOOLS:-none}
    container_name: qxdho-dsh
    restart: unless-stopped
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    env_file: .env
    ports:
      # 默认只绑 127.0.0.1，供宿主机反向代理/SSH 隧道接入。
      # 直接局域网访问时把 DSH_BIND 设为 0.0.0.0。
      - "${DSH_BIND:-127.0.0.1}:${DSH_HTTP_PORT:-3080}:3080"
    environment:
      # 数据根，必须与 volumes 的目标路径一致。
      DSH_HOME: ${DSH_HOME_CONTAINER:-/dsh}
      # 目录选择器以 HOME 为起点；让 HOME 指向工作区，打开选择器就是 /workspace。
      # 数据仍由 DSH_HOME 指向 /dsh，两者不混。
      HOME: ${DSH_WORKSPACE_CONTAINER:-/workspace}
      # dsh-web-startup-auth 替换了 dsh 的 startup，因此可以监听 0.0.0.0。
      DSH_HOST: 0.0.0.0
      DSH_PORT: 3080
      DSH_AUTH_USER: ${DSH_AUTH_USER:-admin}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD:?请在 .env 中设置 DSH_AUTH_PASSWORD}
      # 仅用于拼对外 URL；Cookie Secure 由反代补（见 README 的 HTTPS 小节）。
      DSH_COOKIE_SECURE: ${DSH_COOKIE_SECURE:-0}
      DSH_PUBLIC_HOST: ${DSH_PUBLIC_HOST:-}
      # off | optional；v2 不支持 required（没有 TOTP）
      DSH_AUTH_TOTP: ${DSH_AUTH_TOTP:-optional}
      DSH_DISK_MIN_MB: ${DSH_DISK_MIN_MB:-256}
      DSH_WORKSPACE_STRICT: ${DSH_WORKSPACE_STRICT:-0}
    volumes:
      - ${DSH_HOME_HOST:-/dsh}:${DSH_HOME_CONTAINER:-/dsh}
      - ${DSH_WORKSPACE_HOST:-/dsh/workspace}:${DSH_WORKSPACE_CONTAINER:-/workspace}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
