services:
  dsh:
    # 默认拉起 GHCR 上由 GitHub Actions 构建好的镜像；本地改代码后可
    # `./dshm service up --build` 或 `docker compose build` 覆盖。
    image: ${DSH_IMAGE:-ghcr.io/qxdho/deepseek-harness-docker:latest}
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.7-rc.2}
        AUTH_GATE_VERSION: ${AUTH_GATE_VERSION:-0.15.0}
        DEV_TOOLS: ${DEV_TOOLS:-none}
    container_name: qxdho-dsh
    restart: unless-stopped
    # 容器内以哪个 uid/gid 运行。默认 1000:1000（镜像的 USER node）。
    # 宿主用户不是 1000 时（NAS、部分桌面发行版等）在 .env 里设 DSH_UID/DSH_GID
    # 为你的 uid/gid，这样 bind mount 的属主天然对得上，不用 chown 成 1000。
    # 注意：scripts/preflight.sh 会按同一组值检查工作区与 dsh-home 卷的属主，
    # 两边必须一致 —— 改这里的同时预检就已随之调整，无需额外操作。
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    # .env 里的变量都会传进容器，所以可以直接在 .env 里加
    # DEEPSEEK_API_KEY=sk-... 来配置模型（也可以登录后在网页设置里配）
    env_file: .env
    ports:
      # 默认绑 127.0.0.1：只有宿主机自己能访问，供你在宿主机上加 HTTPS 反代。
      # 想直接从局域网访问（未加反代前测试用），把 DSH_BIND 改成 0.0.0.0。
      - "${DSH_BIND:-127.0.0.1}:${PROXY_PORT:-3080}:3080"
    environment:
      DSH_AUTH_USER: ${DSH_AUTH_USER:-admin}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD:?请在 .env 中设置 DSH_AUTH_PASSWORD}
      # HOME 指向持久卷而不是镜像里的 /home/node。两个原因：
      #   1. 镜像里 /home/node 是 node(1000) 的 755 目录，DSH_UID 不是 1000 时
      #      容器用户对它没有写权限，npm / pnpm / git 想往 $HOME 写缓存或配置就会失败。
      #   2. 这个卷的属主由 preflight 按 DSH_UID 修正过，保证容器用户可写。
      # DSH_HOME 本来就是绝对路径，不依赖 HOME，所以这样改不影响 dsh 自身。
      HOME: ${DSH_HOME:-/home/node/.dsh}
      # 容器内代理固定监听 3080，与上面 ports: 的容器侧一致。
      # 必须在这里钉死：`env_file: .env` 会把 .env 里的 PROXY_PORT（它表示**宿主
      # 端口**）也注入容器，覆盖镜像的 ENV PROXY_PORT=3080，于是代理会去监听
      # 9090 之类，而 ports: 仍然映射宿主 9090 -> 容器 3080 —— 结果容器自称健康、
      # 外部却连不上。environment 的优先级高于 env_file，所以这里写 3080 即可让
      # PROXY_PORT 只表示宿主端口。
      PROXY_PORT: 3080
      # off | optional | required
      DSH_TOTP: ${DSH_TOTP:-optional}
      # 走 HTTPS 时设为 1（否则会话 cookie 不带 Secure）
      DSH_COOKIE_SECURE: ${DSH_COOKIE_SECURE:-0}
      # 登录页显示的域名，例如 dsh.example.com；留空则显示回环地址
      DSH_PUBLIC_HOST: ${DSH_PUBLIC_HOST:-}
    volumes:
      - dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-./workspace}:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  dsh-admin:
    # DSH Docker 管理面板（`./dshm admin install --container` 启用）。
    # 关键安全边界：**只有这个容器挂 docker.sock**，dsh 容器永远不挂。
    # 面板只调固定几个 Engine 接口、独立登录、默认只绑 127.0.0.1。
    # 用 compose profile "admin" 控制是否启用（install.sh/.env 里写 COMPOSE_PROFILES=admin）。
    image: ${DSH_ADMIN_IMAGE:-ghcr.io/qxdho/deepseek-harness-docker-admin:latest}
    build:
      context: ./admin
    container_name: qxdho-admin
    profiles: ["admin"]
    restart: unless-stopped
    ports:
      - "${DSH_ADMIN_BIND:-127.0.0.1}:${DSH_ADMIN_PORT:-3090}:3090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 面板配置（口令哈希 + 会话密钥），由 ./dshm admin 生成，权限 600
      - ./admin/config.json:/config/config.json:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dsh-home:
