# dsh-auth-gate bundle patch: inserts the login-gate plugin.
#
# Mount into a profile automatically: `dsh plugin --profile web add dsh-auth-gate`
# reconciles `dsh.profile.bundles` for packages that declare `dsh.bundle`, so
# this row is registered on install (no manual patch editing needed).
#
# Per-deployment configuration (mode, cookieSecure, ...) is deliberately NOT
# baked into this bundle patch — it is applied as a config override in the
# user layer ($DSH_HOME/cordis.patch.yml or the profile's cordis.patch.yml,
# both applied after every bundle layer):

- insert:
    - id: dsh-auth-gate
      name: "dsh-auth-gate"
